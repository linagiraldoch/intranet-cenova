:root{--bg:#f3f6fb;--surface:#fff;--surface-2:#edf1f7;--border:#dde3ee;--text:#16233a;--text-muted:#5b6b80;--accent:#2456a6;--accent-2:#173a73;--accent-soft:#e7eefb;--critical:#b93b3b;--warning:#a86a0c;--warning-soft:#faf0da;--shadow:0 1px 2px rgba(20,32,52,.06),0 10px 28px -14px rgba(20,32,52,.22);color-scheme:light;}
:root[data-theme="dark"]{--bg:#0d1520;--surface:#131d29;--surface-2:#182432;--border:#263344;--text:#e7edf6;--text-muted:#8fa0b5;--accent:#6f9fe8;--accent-2:#a9c7f4;--accent-soft:#1b2c47;--critical:#e2716b;color-scheme:dark;}
:root[data-theme="lavanda"]{--bg:#f7f3fc;--surface:#fff;--surface-2:#f4effb;--border:#e7ddf4;--text:#2d2344;--text-muted:#76698f;--accent:#7b5cc9;--accent-2:#4f3591;--accent-soft:#efe8fc;--critical:#c2416a;}
*{box-sizing:border-box;} html,body{margin:0;padding:0;} body{background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14.5px;-webkit-font-smoothing:antialiased;}
html.cenova-locked .app{visibility:hidden;}
#cenovaLogin{position:fixed; inset:0; z-index:100; display:none; align-items:center; justify-content:center; padding:24px 16px; overflow-y:auto;
  background:radial-gradient(1200px 600px at 10% -10%, var(--accent-soft), transparent 60%), radial-gradient(900px 500px at 110% 110%, var(--accent-soft), transparent 55%), var(--bg);}
#cenovaLogin.open{display:flex;}
.lg-card{width:100%; max-width:400px; background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:0 30px 70px -30px rgba(20,32,52,.45); padding:34px 30px 22px; display:flex; flex-direction:column; gap:14px; animation:lgIn .25s ease-out;}
@keyframes lgIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.lg-logo{width:84px; height:84px; margin:0 auto 2px; border-radius:22px; background:#fff; display:flex; align-items:center; justify-content:center; box-shadow:0 10px 26px -12px rgba(23,58,115,.45), 0 0 0 1px var(--border);}
.lg-logo img{width:64px; height:64px; object-fit:contain;}
.lg-card h1{margin:0; text-align:center; font-family:"Manrope",sans-serif; font-size:22px; font-weight:800; color:var(--text);}
.lg-sub{margin:-8px 0 6px; text-align:center; color:var(--text-muted); font-size:13px;}
.lg-card form{display:flex; flex-direction:column; gap:12px;}
.lg-card label{display:flex; flex-direction:column; gap:5px; font-size:12.5px; font-weight:600; color:var(--text-muted);}
.lg-card input{background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:11px 12px; font-size:14.5px; font-family:inherit; color:var(--text); width:100%; box-sizing:border-box;}
.lg-card input:focus{outline:2px solid var(--accent); outline-offset:1px;}
.lg-pass{position:relative; display:block;}
.lg-pass input{padding-right:40px;}
.lg-pass button{position:absolute; right:6px; top:50%; transform:translateY(-50%); border:none; background:none; cursor:pointer; font-size:15px; opacity:.6;}
.lg-btn{margin-top:4px; border:none; border-radius:10px; padding:12px; font-size:14.5px; font-weight:700; cursor:pointer; background:var(--accent); color:#fff; font-family:inherit;}
.lg-btn:disabled{opacity:.6; cursor:wait;}
.lg-link{border:none; background:none; color:var(--text-muted); cursor:pointer; font-size:12.5px; font-family:inherit;}
.lg-error{min-height:18px; font-size:12.8px; color:var(--critical); font-weight:600;}
.lg-error.info{color:var(--accent-2); font-weight:500;}
.lg-note{background:var(--accent-soft); color:var(--accent-2); border-radius:10px; padding:10px 12px; font-size:13px; line-height:1.5;}
.lg-hint{font-size:11.8px; color:var(--text-muted); margin-top:-4px;}
.lg-foot{margin-top:6px; padding-top:12px; border-top:1px solid var(--border); font-size:11.5px; color:var(--text-muted); text-align:center; line-height:1.5;}
:root[data-theme="dark"] .lg-logo{box-shadow:0 0 0 1px #2d4466, 0 0 34px -4px rgba(111,159,232,.55);}
:root[data-theme="dark"] .lg-btn{color:#0d1520;}
:root[data-theme="dark"] .lg-card{box-shadow:0 30px 70px -30px rgba(0,0,0,.8);}
:root[data-theme="lavanda"] #cenovaLogin{background:radial-gradient(900px 520px at 0% 0%, #fde3ef, transparent 60%), radial-gradient(900px 520px at 100% 100%, #dff0fc, transparent 60%), linear-gradient(135deg,#fdf1f8,#f3eefc 50%,#eaf5fd);}
:root[data-theme="lavanda"] .lg-logo{border:3px solid transparent; background-image:linear-gradient(#fff,#fff), linear-gradient(135deg,#f3a9c9,#b9a3ec,#9fd0f2); background-origin:border-box; background-clip:padding-box, border-box; box-shadow:0 12px 30px -12px rgba(139,111,214,.6);}
:root[data-theme="lavanda"] .lg-card{background:linear-gradient(90deg,#f3a9c9,#b9a3ec,#9fd0f2) top/100% 4px no-repeat, #fff;}
:root[data-theme="lavanda"] .lg-card h1{color:var(--accent-2);}
:root[data-theme="lavanda"] .lg-btn{background:linear-gradient(135deg,#8467d4,#b77ac0);}
#cenovaAviso{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:120; background:var(--warning-soft); color:var(--warning); border:1px solid var(--warning); border-radius:10px; padding:10px 16px; font-size:13px; font-weight:600; box-shadow:var(--shadow); max-width:92vw;}
.session-card{display:flex; flex-direction:column; gap:8px; padding:10px; border:1px solid var(--border); border-radius:10px; background:var(--surface);}
.session-card:empty{display:none;}
.session-card .ses-row{display:flex; align-items:center; gap:8px; font-size:12.5px;}
.session-card .ses-row div{display:flex; flex-direction:column; line-height:1.25;}
.session-card .ses-row strong{font-weight:700;}
.session-card .ses-row span{color:var(--text-muted); font-size:11px;}
